<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados de la Liga</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <div class="container-fluid bg-dark text-white py-3 mb-4">
        <div class="text-center">
            <h1>Resultados de la Liga</h1>
        </div>
    </div>

    <!-- Resultados -->
    <div class="container py-5">
        <h2 class="mb-4 text-center">Resultados</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Fecha</th>
                        <th>Local</th>
                        <th>Visitante</th>
                        <th>Resultado</th>
                    </tr>
                </thead>
                <tbody id="resultados"></tbody>
            </table>
        </div>
    </div>

    <!-- Clasificación -->
    <div class="container py-5">
        <h2 class="mb-4 text-center">Clasificación</h2>
        <div class="table-responsive">
            <table class="table table-striped table-bordered text-center">
                <thead class="thead-dark">
                    <tr>
                        <th>Pos</th>
                        <th>Equipo</th>
                        <th>Puntos</th>
                        <th>GF</th>
                        <th>GC</th>
                    </tr>
                </thead>
                <tbody id="clasificacion"></tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <div class="container-fluid bg-dark text-secondary mt-5 pt-5">
        <div class="row px-xl-5 pt-5">
            <div class="col-lg-12 text-center mb-5">
                <p class="mb-0 text-secondary">
                    &copy; 2025 Resultados de la Liga. Diseñado por <a class="text-primary" href="#">Tu Nombre</a>
                </p>
            </div>
        </div>
    </div>

    <!-- Back to Top -->
    <a href="#" class="btn btn-primary back-to-top"><i class="fa fa-angle-double-up"></i></a>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.bundle.min.js"></script>
    
    <script>
    $(document).ready(function(){
        // Enlaces a tus Google Sheets publicados como CSV
        const resultadosCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQAkMHyuIxrYksIUiAbQcXptX-Mun1KfVY3jkfBa8tJVb7kPZ57_4hV0vqyJUqrsMEHkssZ30vyOur4/pub?gid=1331028797&single=true&output=csv';
        const clasificacionCSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQAkMHyuIxrYksIUiAbQcXptX-Mun1KfVY3jkfBa8tJVb7kPZ57_4hV0vqyJUqrsMEHkssZ30vyOur4/pub?gid=0&single=true&output=csv';

        function cargarCSV(url, tbodyId){
            $.ajax({
                url: url,
                dataType: 'text',
            }).done(function(data) {
                let rows = data.split('\n');
                let html = '';
                rows.forEach(function(row, index){
                    if(row.trim() !== ''){
                        let cols = row.split(',');
                        // Ignorar fila de encabezado en CSV
                        if(index === 0) return;
                        html += '<tr>';
                        cols.forEach(function(col){ html += '<td>'+col+'</td>'; });
                        html += '</tr>';
                    }
                });
                $(tbodyId).html(html);
            });
        }

        cargarCSV(resultadosCSV, '#resultados');
        cargarCSV(clasificacionCSV, '#clasificacion');
    });
    </script>
</body>
</html>
