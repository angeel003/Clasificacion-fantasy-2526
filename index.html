<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resultados Fantasy</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
    body {
        margin: 0;
        font-family: 'Roboto', sans-serif;
        background-color: #f0f0f0;
        color: #333;
    }
    h1, h2 {
        text-align: center;
        margin: 40px 0 20px;
    }
    h1 {
        font-size: 3em;
        font-weight: 700;
    }
    h2 {
        font-size: 2em;
        margin-bottom: 30px;
    }
    section {
        padding: 40px 20px;
    }
    .bg1 { background-color: #e0e0e0; }
    .bg2 { background-color: #f5f5f5; }
    table {
        margin: 0 auto;
        border-collapse: collapse;
        width: 90%;
        max-width: 1000px;
    }
    th, td {
        padding: 12px 15px;
        text-align: center;
        border: 1px solid #ccc;
        transition: all 0.3s ease;
    }
    tr:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        background-color: #fafafa;
    }
    tr.top1 { background-color: #fff8e1; font-size: 1.2em; font-weight: bold; }
    tr.top2 { background-color: #fffde7; font-size: 1.1em; font-weight: bold; }
    tr.top3 { background-color: #fffde7; font-weight: bold; }
    tr.bottom2 { background-color: #ffe5e5; }
    tr.bottom1 { background-color: #ffe5e5; }
    .patrocinadores {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 80px;
        margin-top: 40px;
    }
    .patrocinador {
        text-align: center;
    }
    .patrocinador img {
        max-width: 150px;
        height: auto;
        display: block;
        margin: 0 auto 10px;
    }
    footer {
        text-align: center;
        padding: 20px;
        background-color: #dcdcdc;
        font-size: 0.9em;
    }
</style>
</head>
<body>

<header>
    <h1>Fantasy League 2025</h1>
    <p style="text-align:center; font-size:1.2em;">Resultados oficiales y clasificación jornada a jornada</p>
</header>

<section class="bg1">
    <h2>Clasificación General</h2>
    <table id="tabla-global">
        <thead>
            <tr>
                <th>Jugador</th>
                <th>Puntos</th>
                <th>Dinero</th>
            </tr>
        </thead>
        <tbody>
            <!-- Se llenará por JavaScript -->
        </tbody>
    </table>
</section>

<section class="bg2">
    <h2>Jornada a Jornada</h2>
    <table id="tabla-jornada">
        <thead>
            <tr>
                <th>Jornada</th>
                <th>Jugador</th>
                <th>Puntos</th>
                <th>Ranking</th>
                <th>Dinero</th>
            </tr>
        </thead>
        <tbody>
            <!-- Se llenará por JavaScript -->
        </tbody>
    </table>
</section>

<section class="bg1">
    <h2>Nuestros Patrocinadores</h2>
    <div class="patrocinadores">
        <div class="patrocinador">
            <img src="ruta-a-dessert-links.png" alt="Dessert Links">
            <p>Dessert<br>Links</p>
        </div>
        <div class="patrocinador">
            <img src="ruta-a-three-world.png" alt="Three World">
            <p>Three<br>World</p>
        </div>
        <div class="patrocinador">
            <img src="ruta-a-vpv-paraiso.png" alt="VPV Paraíso">
            <p>VPV<br>Paraíso</p>
        </div>
    </div>
</section>

<footer>
    Página web oficial de Fantasy League 2025
</footer>

<script>
async function fetchCSV(url) {
    const response = await fetch(url);
    const text = await response.text();
    const rows = text.trim().split('\n');
    const headers = rows[0].split(',');
    return rows.slice(1).map(row => {
        const values = row.split(',');
        const obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i].trim());
        return obj;
    });
}

function construirTablaGlobal(data) {
    const tabla = document.getElementById("tabla-global").querySelector("tbody");
    tabla.innerHTML = "";

    data.forEach((row, index) => {
        let dinero = row["Total Dinero"].replace(",", ".");
        dinero = parseFloat(dinero).toFixed(2) + " €";

        const tr = document.createElement("tr");

        if(index === 0) tr.className = "top1";
        else if(index === 1) tr.className = "top2";
        else if(index === 2) tr.className = "top3";
        else if(index === data.length - 2) tr.className = "bottom2";
        else if(index === data.length - 1) tr.className = "bottom1";

        let medal = "";
        if (index === 0) medal = " 🥇";
        else if (index === 1) medal = " 🥈";
        else if (index === 2) medal = " 🥉";

        tr.innerHTML = `
            <td>${row["Jugador"]}${medal}</td>
            <td>${row["Total Puntos"]}</td>
            <td>${dinero}</td>
        `;
        tabla.appendChild(tr);
    });
}

function construirTablaJornada(data) {
    const tabla = document.getElementById("tabla-jornada").querySelector("tbody");
    tabla.innerHTML = "";

    data.forEach(row => {
        let dinero = row["Dinero"].replace(",", ".");
        dinero = parseFloat(dinero).toFixed(2) + " €";

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${row["Jornada"]}</td>
            <td>${row["Jugador"]}</td>
            <td>${row["Puntos"]}</td>
            <td>${row["Ranking"]}</td>
            <td>${dinero}</td>
        `;
        tabla.appendChild(tr);
    });
}

async function init() {
    const globalData = await fetchCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vQAkMHyuIxrYksIUiAbQcXptX-Mun1KfVY3jkfBa8tJVb7kPZ57_4hV0vqyJUqrsMEHkssZ30vyOur4/pub?gid=1331028797&single=true&output=csv");
    construirTablaGlobal(globalData);

    const jornadaData = await fetchCSV("https://docs.google.com/spreadsheets/d/e/2PACX-1vQAkMHyuIxrYksIUiAbQcXptX-Mun1KfVY3jkfBa8tJVb7kPZ57_4hV0vqyJUqrsMEHkssZ30vyOur4/pub?gid=0&single=true&output=csv");
    construirTablaJornada(jornadaData);
}

init();
</script>

</body>
</html>
