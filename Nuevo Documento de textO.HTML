<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mis Tablas</title>
<style>
  body {
    font-family: 'Arial', sans-serif;
    background: #f4f4f9;
    margin: 0;
    padding: 0;
    text-align: center;
  }

  header {
    background-color: #4a90e2;
    color: white;
    padding: 20px 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  }

  h1 {
    margin: 0;
  }

  .tabs {
    margin: 30px auto;
    max-width: 800px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }

  .tab-button {
    background: #e0e0e0;
    border: none;
    padding: 10px 20px;
    border-radius: 5px 5px 0 0;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s;
  }

  .tab-button.active {
    background: #4a90e2;
    color: white;
  }

  .tab-content {
    max-width: 800px;
    margin: 0 auto 50px;
    border: 2px solid #4a90e2;
    border-radius: 0 0 10px 10px;
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    padding: 10px;
    border: 1px solid #ccc;
    text-align: left;
  }

  th {
    background-color: #4a90e2;
    color: white;
  }

  tr:nth-child(even) {
    background-color: #f2f2f2;
  }

  footer {
    margin-top: 40px;
    padding: 20px;
    background: #333;
    color: white;
  }
</style>
</head>
<body>

<header>
  <h1>Mis Tablas de Google Sheets</h1>
  <p>Selecciona una tabla para verla</p>
</header>

<div class="tabs">
  <button class="tab-button active" onclick="showTab('tabla1')">Tabla 1</button>
  <button class="tab-button" onclick="showTab('tabla2')">Tabla 2</button>
</div>

<div class="tab-content">
  <div id="tabla1"></div>
  <div id="tabla2" style="display:none;"></div>
</div>

<footer>
  <p>Creado por [Tu Nombre]</p>
</footer>

<script>
// Función para cambiar de tabla
function showTab(tabId) {
  document.getElementById('tabla1').style.display = 'none';
  document.getElementById('tabla2').style.display = 'none';
  document.getElementById(tabId).style.display = 'block';

  document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
  if(tabId === 'tabla1') {
    document.querySelectorAll('.tab-button')[0].classList.add('active');
  } else {
    document.querySelectorAll('.tab-button')[1].classList.add('active');
  }
}

// Función para cargar CSV en tabla
function cargarCSV(url, contenedorId) {
  fetch(url)
    .then(r => r.text())
    .then(data => {
      const rows = data.split('\n');
      const container = document.getElementById(contenedorId);
      const table = document.createElement('table');
      rows.forEach(row => {
        const tr = document.createElement('tr');
        row.split(',').forEach(cell => {
          const td = document.createElement(tr.tagName === 'TR' && tr.children.length === 0 ? 'th' : 'td');
          td.textContent = cell;
          tr.appendChild(td);
        });
        table.appendChild(tr);
      });
      container.appendChild(table);
    });
}

// Reemplaza con tus enlaces CSV publicados de Google Sheets
cargarCSV('ENLACE_CSV_TABLA_1', 'tabla1');
cargarCSV('https://docs.google.com/spreadsheets/d/e/2PACX-1vQAkMHyuIxrYksIUiAbQcXptX-Mun1KfVY3jkfBa8tJVb7kPZ57_4hV0vqyJUqrsMEHkssZ30vyOur4/pub?gid=0&single=true&output=csv', 'tabla2');
</script>

</body>
</html>
